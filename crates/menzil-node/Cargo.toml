[package]
name = "menzil-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ed25519-dalek.workspace = true
fastrand.workspace = true
menzil-carrier = { path = "../menzil-carrier" }
menzil-proto = { path = "../menzil-proto" }
menzil-session = { path = "../menzil-session" }
menzil-stream = { path = "../menzil-stream" }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true

[dev-dependencies]
# menzil-relay, rcgen, rustls: tests/live_session.rs's in-process relay and
# its self-signed test certificate.
menzil-relay = { path = "../menzil-relay" }
rand = "0.10.3"
rcgen = "0.14.10"
rustls.workspace = true
snow = "0.10.0"
tokio = { workspace = true, features = ["test-util"] }
