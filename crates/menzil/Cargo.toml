[package]
name = "menzil"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "menzil_cli"
path = "src/lib.rs"

[[bin]]
name = "menzil"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
ed25519-dalek = { workspace = true }
menzil-admin = { path = "../menzil-admin" }
menzil-carrier = { path = "../menzil-carrier" }
menzil-node = { path = "../menzil-node" }
menzil-relay = { path = "../menzil-relay" }
menzil-stream = { path = "../menzil-stream" }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "io"] }
menzil-proto = { path = "../menzil-proto" }
rustls = { workspace = true }
rustix = { version = "1", default-features = false, features = ["std", "stdio"] }
serde = { workspace = true }
socket2 = { workspace = true }
thiserror = { workspace = true }
toml = "1"
tokio = { workspace = true, features = ["net", "io-util", "io-std", "signal", "time", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = "1"

[dev-dependencies]
rand = "0.10.3"
rcgen = "0.14.10"
tempfile = "3"
