[workspace]
resolver = "2"
members = [
    "crates/menzil-proto",
    "crates/menzil-carrier",
    "crates/menzil-session",
    "crates/menzil-e2e",
    "crates/menzil-stream",
    "crates/menzil-relay",
    "crates/menzil-node",
    "crates/menzil",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/mfyuce/menzil"
rust-version = "1.91"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
blake2 = "0.11.0"
ciborium = "0.2.2"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
serde = { version = "1.0.229", features = ["derive"] }
base64 = "0.23.1"
fastrand = "2.5.0"
httparse = "1.10.1"
rustls = { version = "0.23.45", default-features = false, features = ["tls12", "logging"] }
rustls-platform-verifier = "0.7.1"
socket2 = "0.6.5"
tokio-rustls = { version = "0.26.5", default-features = false }
tokio-tungstenite = "0.30.0"
url = "2.5.8"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
